<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">DBeer — Your data. On tap.</title>
  <desc id="description">An amber database and foam mark beside a SQL illustration, on a deep green background. A native database client for macOS.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102e29"/>
      <stop offset="1" stop-color="#1b4539"/>
    </linearGradient>
    <linearGradient id="beer" x1="24" y1="8" x2="24" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edbd57"/>
      <stop offset="1" stop-color="#d99a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#f5f0e5" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="canvas"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1280" height="440" fill="url(#background)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <circle cx="1160" cy="430" r="340" stroke="#edbd57" stroke-opacity=".09"/>
    <circle cx="1160" cy="430" r="280" stroke="#edbd57" stroke-opacity=".09"/>
    <circle cx="1160" cy="430" r="220" stroke="#edbd57" stroke-opacity=".09"/>

    <!-- Reuse the application's database-and-foam mark. -->
    <g transform="translate(62 31) scale(1.1)" stroke="#173f35" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
      <path d="M9 15c0-4 7-7 15-7s15 3 15 7v23c0 4-7 7-15 7s-15-3-15-7V15Z" fill="url(#beer)"/>
      <path d="M9 23c0 4 7 7 15 7s15-3 15-7M9 32c0 4 7 7 15 7s15-3 15-7M9 15c0 4 7 7 15 7s15-3 15-7"/>
      <path d="M9 17c-4-1-6-4-5-7 1-3 3-4 6-4 0-3 3-5 6-5s5 1 6 4c2-2 4-2 6-1 2 0 3 2 4 4 3-1 6 0 7 3 3 0 5 2 5 5s-3 5-6 4l-5-1c-3 3-8 3-11 0-4 2-8 2-11-1l-2-1Z" fill="#f5f0e5"/>
      <path d="M29 21v4c0 2 1 3 3 3s3-1 3-3v-5" fill="#f5f0e5" stroke-width="2"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="128" y="68" fill="#f5f0e5" font-size="29" font-weight="700" letter-spacing="-.8">DBeer</text>
      <text x="64" y="185" fill="#f5f0e5" font-size="76" font-weight="700" letter-spacing="-3">Your data.</text>
      <text x="64" y="266" fill="#edbd57" font-size="76" font-weight="700" letter-spacing="-3">On tap.</text>
      <text x="67" y="314" fill="#c2d3c9" font-size="21">A native database client for macOS.</text>
      <circle cx="72" cy="380" r="4" fill="#edbd57"/>
      <text x="88" y="385" fill="#c2d3c9" font-size="13" font-weight="600" letter-spacing="2">SWIFT + GO</text>
      <circle cx="221" cy="380" r="2" fill="#779487"/>
      <text x="237" y="385" fill="#c2d3c9" font-size="13" font-weight="600" letter-spacing="2">OPEN SOURCE</text>
    </g>

    <!-- A decorative SQL example, rather than an application screenshot. -->
    <rect x="651" y="79" width="560" height="300" rx="17" fill="#071c17" fill-opacity=".3"/>
    <rect x="643" y="67" width="560" height="300" rx="17" fill="#f5f0e5"/>
    <path d="M643 115H1203" stroke="#d8ddd2"/>
    <circle cx="668" cy="92" r="5" fill="#dba69b"/>
    <circle cx="686" cy="92" r="5" fill="#edbd57"/>
    <circle cx="704" cy="92" r="5" fill="#91b09b"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="739" y="98" fill="#62786d" font-size="13">a_good_day.sql</text>
      <g fill="#a0ada1" font-size="15">
        <text x="668" y="155">1</text>
        <text x="668" y="189">2</text>
        <text x="668" y="223">3</text>
      </g>
      <text x="710" y="155" fill="#4a6c9b" font-weight="700">SELECT</text>
      <text x="732" y="189" fill="#3d785b">'good queries'</text>
      <text x="894" y="189" fill="#4a6c9b">AS</text>
      <text x="927" y="189" fill="#173f35">mood,</text>
      <text x="732" y="223" fill="#3d785b">'on tap'</text>
      <text x="829" y="223" fill="#4a6c9b">AS</text>
      <text x="862" y="223" fill="#173f35">data;</text>
      <rect x="663" y="250" width="520" height="65" rx="8" fill="#e8ebdf"/>
      <path d="M663 278H1183M935 250V315" stroke="#d1d9ca"/>
      <text x="681" y="269" fill="#62786d" font-size="12">mood</text>
      <text x="953" y="269" fill="#62786d" font-size="12">data</text>
      <text x="681" y="301" fill="#173f35" font-size="15">good queries</text>
      <text x="953" y="301" fill="#173f35" font-size="15">on tap</text>
    </g>
    <circle cx="673" cy="341" r="4" fill="#4e8868"/>
    <text x="686" y="346" fill="#62786d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">1 row · good taste included</text>
  </g>
</svg>
