[package]
name = "dbeer-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
native-smoke = ["gpui-kit/test-support"]
product-windows-resources = ["dep:gpui_product_host", "gpui_product_host/windows-manifest-provided-by-host"]

[dependencies]
gpui-kit = { version = "=0.7.3", features = ["tree-sitter", "tree-sitter-sql"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
async-channel = "2"
smol = "2"
unicode-segmentation = "=1.13.3"
uuid = { version = "=1.28.0", features = ["v4"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
roxmltree = "=0.21.1"
plist = { version = "=1.10.1", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }

[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
gpui-base = { path = "vendor/gpui-base" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre = { path = "vendor/gpui-pre" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
gpui_product_host = { package = "gpui-pre", version = "=0.3.9", default-features = false, optional = true }
raw-window-handle = "0.6"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
dbeer_gpui_linux = { package = "gpui-pre-linux", version = "=0.3.9" }
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
